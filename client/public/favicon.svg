<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="fishBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Badge with Nautical Ring -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Wave Ripple at bottom -->
  <path d="M 6 46 Q 16 41 26 46 T 46 46 T 58 46" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M 10 52 Q 22 47 34 52 T 54 52" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Fishing Hook Line Accent -->
  <path d="M 44 8 C 48 14 48 20 44 24 C 40 28 34 26 34 22" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.75"/>
  <path d="M 44 24 C 46 26 49 26 49 23" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

  <!-- Fish Group -->
  <g filter="url(#glow)">
    <!-- Back / Tail Fin -->
    <path d="M 15 32 L 6 22 C 10 30 10 34 6 42 Z" fill="url(#finGrad)"/>

    <!-- Dorsal Fin -->
    <path d="M 24 20 Q 32 12 37 19 Z" fill="url(#finGrad)"/>

    <!-- Main Fish Body (Curved plump arcade fish) -->
    <ellipse cx="32" cy="32" rx="20" ry="13" fill="url(#fishBody)"/>

    <!-- Fish Belly Highlight -->
    <path d="M 18 34 C 22 42 42 42 48 34 C 42 44 24 44 18 34 Z" fill="url(#fishBelly)" opacity="0.9"/>

    <!-- Pectoral Fin -->
    <path d="M 28 32 Q 23 39 30 40 Q 33 38 31 32 Z" fill="url(#finGrad)"/>

    <!-- Cute Big Arcade Eye -->
    <circle cx="43" cy="28" r="4.5" fill="#ffffff"/>
    <circle cx="44.5" cy="28" r="2.6" fill="#0f172a"/>
    <circle cx="45.5" cy="27" r="1.1" fill="#ffffff"/>

    <!-- Friendly Smile -->
    <path d="M 49 34 Q 47 37 44 36" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Air Bubbles -->
    <circle cx="53" cy="20" r="2" fill="#e0f2fe" opacity="0.8"/>
    <circle cx="57" cy="14" r="1.2" fill="#e0f2fe" opacity="0.6"/>
  </g>
</svg>
